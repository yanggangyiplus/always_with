services:
  - type: web
    name: always-with
    runtime: docker
    plan: standard # 모델(torch)이 메모리를 많이 써서 starter(512MB)는 모자랄 수 있어요
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/always_with.db
      - key: CLIP_DIR
        value: /data/clips
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false # 배포된 주소(https://...onrender.com)를 넣어요
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
